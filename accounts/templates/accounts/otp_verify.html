<h1>Vérification en deux étapes</h1>
<p>Entre le code affiché dans ton application d'authentification.</p>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Vérifier</button>
  <a href="{% url 'lost_mfa_device' %}">J'ai perdu l'accès à mon authentificateur</a>
</form>
