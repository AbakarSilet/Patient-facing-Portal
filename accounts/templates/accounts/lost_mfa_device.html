<!-- accounts/templates/accounts/lost_mfa_device.html -->
<p>Un code a été envoyé au {{ phone_masked }}.</p>
{% if resent %}<p>Un nouveau code a été envoyé.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Réinitialiser mon authentification</button>
</form>
<form method="post">
    {% csrf_token %}
    <button type="submit" name="resend" value="1">Je n'ai pas reçu le code</button>
</form>
