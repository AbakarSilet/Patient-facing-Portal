{% if resent %}<p>Un nouveau code a été envoyé.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Réinitialiser le mot de passe</button>
</form>
<form method="post">
    {% csrf_token %}
    <button type="submit" name="resend" value="1">Je n'ai pas reçu le code</button>
</form>
