{% if is_paginated %}
    <nav aria-label="Pagination" class="mt-3">
        <ul class="pagination justify-content-center mb-0">
            {% if page_obj.has_previous %}
                <li class="page-item">
                    <a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Previous page">
                        <i class="ri-arrow-left-s-line"></i>
                    </a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link"><i class="ri-arrow-left-s-line"></i></span></li>
            {% endif %}

            <li class="page-item disabled">
                <span class="page-link">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
            </li>

            {% if page_obj.has_next %}
                <li class="page-item">
                    <a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Next page">
                        <i class="ri-arrow-right-s-line"></i>
                    </a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link"><i class="ri-arrow-right-s-line"></i></span></li>
            {% endif %}
        </ul>
    </nav>
{% endif %}
