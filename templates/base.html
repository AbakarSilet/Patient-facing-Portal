{% load static %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Patient Portal{% endblock %}</title>

    <!-- 1. Bootstrap CSS & Icons (RemixIcon / Bootstrap Icons) -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" integrity="sha384-2+8OcleUOxnP/2cYXK9FBoMe12ojS0iPrrJy9Um4ICFk2AXl8iODUaIoUKI6TmGj" crossorigin="anonymous">
    <!-- 2. Feuille de style globale (Variables & Main) -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- 3. Injection du CSS spécifique à une page -->
    {% block style %}{% endblock %}

    <!-- 4. Script du Thème (anti-FOUC) -->
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body>

    <!-- Header / Navbar Globale -->
    <header class="app-nav">
        <div class="app-container nav-content">
            <a href="{% url 'dashboard' %}" class="text-white text-decoration-none fw-bold fs-5 d-flex align-items-center gap-2">
                <i class="ri-hospital-line fs-4"></i>
                <span>Patient Portal</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <!-- Theme Switcher -->
                <button type="button" class="btn-theme-toggle" onclick="toggleTheme()" title="Changer le thème">
                    <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
                </button>

                {% if user.is_authenticated %}
                    <span class="text-white opacity-75 d-none d-sm-inline">
                        {{ user.username }}
                    </span>
                    <form action="{% url 'logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Zone de contenu principal -->
    <main class="app-container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- Injection du JavaScript spécifique à une page -->
    {% block javascript %}{% endblock %}
</body>
</html>
